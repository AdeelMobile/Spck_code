<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design Studio - Adeel Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .ds-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .ds-tabs::-webkit-scrollbar { display: none; }
  .ds-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
  }
  .ds-tab-btn:hover { border-color: var(--pri); }
  .ds-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  .ds-panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .ds-panel.active { display: block; }
  .ds-panel h3 { font-size: 16px; color: var(--ink); margin-bottom: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

const urlParams = new URLSearchParams(window.location.search);
let currentTab = urlParams.get('tab') || 'adminpanel';

function loadPage() {
  let html = `
  <div class="top"><h2>Design Studio</h2></div>
  
  <div class="ds-tabs">
    <button class="ds-tab-btn ${currentTab==='adminpanel'?'active':''}" onclick="switchTab('adminpanel')">🖥️ Admin Design</button>
    <button class="ds-tab-btn ${currentTab==='userdash'?'active':''}" onclick="switchTab('userdash')">📱 User Design</button>
    <button class="ds-tab-btn ${currentTab==='website'?'active':''}" onclick="switchTab('website')">🌐 Website Design</button>
    <button class="ds-tab-btn ${currentTab==='themes'?'active':''}" onclick="switchTab('themes')">🎨 Theme</button>
    <button class="ds-tab-btn ${currentTab==='global'?'active':''}" onclick="switchTab('global')">⚙️ Global Settings</button>
  </div>

  <div class="ds-panel ${currentTab==='adminpanel'?'active':''}">
    <h3>Admin Design</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>

  <div class="ds-panel ${currentTab==='userdash'?'active':''}">
    <h3>User Design</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>

  <div class="ds-panel ${currentTab==='website'?'active':''}">
    <h3>Website Design</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>

  <div class="ds-panel ${currentTab==='themes'?'active':''}">
    <h3>Theme</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>

  <div class="ds-panel ${currentTab==='global'?'active':''}">
    <h3>Global Settings</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>
  `;

  renderApp('Design Studio', html);
}

function switchTab(tab) {
  currentTab = tab;
  loadPage();
}

loadPage();
</script>
</body>
</html>
