<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Online Store - Adeel Mobile</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/store.css">
</head>
<body>
<div id="root">
  <div id="sec-header"></div>
  <div id="sec-banner"></div>
  <div id="sec-filters"></div>
  <div id="sec-products"></div>
  <div id="sec-features"></div>
  <div id="sec-about"></div>
  <div id="sec-reviews"></div>
  <div id="sec-footer"></div>
</div>

<!-- Modals / Popups (Yeh HTML mein hi rehne chahiye) -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">Title</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Main App Setup -->
<script src="js/app.js"></script>

<!-- ========================================== -->
<!-- WEBSITE LOGIC FILES (6 Alag Files) -->
<!-- Tarteeb (Order) ka khayal rakhein -->
<!-- ========================================== -->
<script src="js/website/core.js"></script>
<script src="js/website/products.js"></script>
<script src="js/website/filters.js"></script>
<script src="js/website/features.js"></script>
<script src="js/website/popups.js"></script>
<script src="js/website/verification.js"></script>

</body>
</html>
