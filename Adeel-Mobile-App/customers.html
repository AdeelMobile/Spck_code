<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customers - Adeel Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .c-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .c-tabs::-webkit-scrollbar { display: none; }
  .c-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .c-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  .c-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
  .c-search { flex: 1; min-width: 200px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; outline: none; }
  .c-filter { width: 150px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; outline: none; }

  .table-container { width: 100%; overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
  .cust-table { width: 100%; border-collapse: collapse; min-width: 700px; }
  .cust-table th { background: #f8fafc; color: var(--mute); font-size: 12px; font-weight: 700; text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cust-table td { padding: 10px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink); vertical-align: middle; }
  .cust-table tr:last-child td { border-bottom: none; }
  .cust-table tr:hover { background: #f8fafc; }
  .sno-col { color: var(--mute); font-weight: 600; text-align: center; width: 40px; }

  .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; display: inline-block; text-transform: uppercase; }
  .badge.pending { background: #fef3c7; color: #92400e; }
  .badge.approved { background: #d1fae5; color: #065f46; }
  .badge.rejected { background: #fee2e2; color: #991b1b; }
  .badge.active { background: #e2e8f0; color: #475569; }

  .btn-wa-sm { background: #25D366; color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 11px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: none; cursor: pointer; }
  .btn-wa-sm:active { background: #128C7E; }
  .btn-wa-sm svg { width: 14px; height: 14px; fill: currentColor; }

  /* Load More Button */
  .load-more-wrap { text-align: center; margin-top: 20px; margin-bottom: 30px; }
  .load-more-btn { background: var(--pri2); color: var(--pri); border: 1px solid var(--pri); border-radius: 8px; padding: 12px 24px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .load-more-btn:active { background: var(--pri); color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

let currentTab = 'installment'; 
let searchQuery = '';
let filterUser = '';
let allCustomers = []; 
let isImporting = false;

// Pagination variables
let displayLimit = 50; // Shuru mein 50 numbers show honge
const LOAD_STEP = 50;  // Har baar 50 numbers load honge

async function fetchCustomers() {
  try {
    if (!supabaseClient) return;
    
    let allData = [];
    let from = 0;
    const pageSize = 1000;
    let hasMore = true;

    while (hasMore) {
      const { data, error } = await supabaseClient
        .from('customers')
        .select('*')
        .order('created_at', { ascending: false })
        .range(from, from + pageSize - 1);
      
      if (error) throw error;
      
      if (data && data.length > 0) {
        allData = allData.concat(data);
        from += pageSize;
      }
      
      if (!data || data.length < pageSize) {
        hasMore = false;
      }
    }
    
    allCustomers = allData;
  } catch (err) {
    console.error(err);
  }
}

function getCustomersHtml() {
  let filtered = allCustomers;

  if (currentTab === 'installment') {
    filtered = filtered.filter(c => c.type === 'Installment');
  } else if (currentTab === 'calls') {
    filtered = filtered.filter(c => c.type === 'WhatsApp Lead' || c.type === 'General' || !c.type);
  } else if (currentTab === 'marketing') {
    filtered = filtered.filter(c => c.type === 'Marketing');
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(c => (c.name && c.name.toLowerCase().includes(q)) || (c.phone && c.phone.includes(q)));
  }

  if (filterUser) {
    filtered = filtered.filter(c => c.added_by === filterUser);
  }

  if (filtered.length === 0) {
    return '<div style="text-align:center; padding:40px; color:var(--mute);">No customers found.</div>';
  }

  // Pagination apply karo (Sirf displayLimit tak show karo)
  const limitedData = filtered.slice(0, displayLimit);

  let rows = limitedData.map((c, index) => {
    const userObj = D.users.find(u => u.id === c.added_by);
    const userName = userObj ? userObj.name : (c.added_by || 'Admin');

    let statusClass = 'active';
    let statusText = c.verify_status || c.status || 'Active';
    if (statusText === 'Pending') statusClass = 'pending';
    else if (statusText === 'Approved') statusClass = 'approved';
    else if (statusText === 'Rejected') statusClass = 'rejected';

    const waMsg = encodeURIComponent(`Assalam o Alaikum ${c.name !== 'Unknown' ? c.name : ''}! Adeel Mobile ki taraf se...`);
    const waPhone = (c.phone || '').replace(/\D/g, '');
    const waLink = `https://wa.me/${waPhone}?text=${waMsg}`;

    const dateStr = c.verify_date ? new Date(c.verify_date).toLocaleDateString('en-GB') : (c.created_at ? new Date(c.created_at).toLocaleDateString('en-GB') : 'N/A');

    return `
      <tr>
        <td class="sno-col">${index + 1}</td>
        <td><b>${esc(c.name)}</b></td>
        <td>${esc(c.phone)}</td>
        <td>${esc(userName)}</td>
        <td>${dateStr}</td>
        <td><span class="badge ${statusClass}">${statusText}</span></td>
        <td>
          <a href="${waLink}" target="_blank" class="btn-wa-sm">
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            WhatsApp
          </a>
        </td>
      </tr>
    `;
  }).join('');

  // Load More button (Agar aur data baqi hai toh show karo)
  let loadMoreHtml = '';
  if (filtered.length > displayLimit) {
    loadMoreHtml = `
      <div class="load-more-wrap">
        <button class="load-more-btn" onclick="loadMoreData()">
          ⬇️ Load More (${filtered.length - displayLimit} remaining)
        </button>
      </div>
    `;
  }

  return `
    <div class="table-container">
      <table class="cust-table">
        <thead>
          <tr>
            <th class="sno-col">#</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Added By</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
    ${loadMoreHtml}
  `;
}

// Load More Button Function
function loadMoreData() {
  displayLimit += LOAD_STEP;
  const container = document.getElementById('customerListContainer');
  if(container) container.innerHTML = getCustomersHtml();
}

async function loadCustomers(){
  await fetchCustomers();

  let html = `
  <div class="top"><h2>Customers</h2></div>
  
  <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
    <button class="btn" onclick="openAddCustomer()">➕ Add Customer</button>
    <button class="btn sec" onclick="openBulkImport()">📥 Bulk Import</button>
    <button class="btn sec" onclick="openCsvImport()">📊 Upload CSV File</button>
  </div>

  <div class="c-tabs">
    <button class="c-tab-btn ${currentTab==='installment'?'active':''}" onclick="switchTab('installment')">👥 Installment</button>
    <button class="c-tab-btn ${currentTab==='calls'?'active':''}" onclick="switchTab('calls')">📞 Calls History</button>
    <button class="c-tab-btn ${currentTab==='marketing'?'active':''}" onclick="switchTab('marketing')">📢 Marketing</button>
  </div>

  <div class="c-controls">
    <input type="text" class="c-search" id="cSearch" placeholder="Search by name or phone..." oninput="handleSearch(this.value)" value="${esc(searchQuery)}">
    
    ${currentTab === 'installment' ? `
    <select class="c-filter" onchange="filterUser=this.value; loadCustomers()">
      <option value="">All Users</option>
      ${D.users.filter(u=>u.role!=='admin').map(u=>`<option value="${u.id}" ${filterUser==u.id?'selected':''}>${esc(u.name)}</option>`).join('')}
    </select>` : ''}
  </div>

  <div id="customerListContainer">
    ${getCustomersHtml()}
  </div>
  `;

  renderApp('Customers', html);
}

function switchTab(tab) {
  currentTab = tab;
  searchQuery = '';
  filterUser = '';
  displayLimit = 50; // Reset pagination
  loadCustomers();
}

function handleSearch(val) {
  searchQuery = val;
  displayLimit = 50; // Reset pagination on search
  const container = document.getElementById('customerListContainer');
  if(container) container.innerHTML = getCustomersHtml();
}

function openAddCustomer() {
  let html = `
    <h3 style="margin-bottom:15px; border-bottom:1px solid #ccc; padding-bottom:10px;">Add Customer</h3>
    <label>Customer Name</label>
    <input id="c_name" placeholder="Enter full name">
    <label>Phone Number</label>
    <input id="c_phone" placeholder="03xx-xxxxxxx">
    <label>Type</label>
    <select id="c_type">
      <option value="Installment">Installment Customer</option>
      <option value="Marketing">Marketing Lead</option>
      <option value="WhatsApp Lead">WhatsApp Lead (Call History)</option>
    </select>
    <div style="margin-top:20px; display:flex; gap:10px;">
      <button class="btn" style="flex:1;" onclick="saveCustomer()">Save</button>
      <button class="btn sec" style="flex:1;" onclick="modal()">Cancel</button>
    </div>
  `;
  modal(html);
}

async function saveCustomer() {
  const name = v('c_name').trim() || 'Unknown';
  const phone = v('c_phone').trim();
  const type = v('c_type');

  if(!phone) return alert('Phone number required');

  try {
    const { error } = await supabaseClient.from('customers').insert([{
      name: name,
      phone: phone,
      type: type,
      added_by: me.username,
      verify_status: type === 'Installment' ? 'Pending' : 'Active'
    }]);
    if (error) throw error;
    alert('Customer added!');
    modal();
    loadCustomers();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

function openBulkImport() {
  let html = `
    <h3 style="margin-bottom:15px; border-bottom:1px solid #ccc; padding-bottom:10px;">Bulk Import</h3>
    <p style="font-size:12px; color:gray; margin-bottom:10px;">Aap 1000+ numbers bhi paste kar sakte hain. Software unko khud hisson mein save karega.</p>
    
    <label>Paste Numbers Here</label>
    <textarea id="bulk_text" rows="6" placeholder="+92 321 4265688&#10;0321-1234567&#10;3262653420"></textarea>
    
    <label>Type</label>
    <select id="bulk_type">
      <option value="WhatsApp Lead">WhatsApp Lead (Call History)</option>
      <option value="Marketing">Marketing List</option>
      <option value="Installment">Installment Customer</option>
    </select>

    <div id="import_progress_box" style="display:none; margin-top:15px;">
      <div style="background:#e2e8f0; height:8px; border-radius:4px; overflow:hidden;">
        <div id="import_progress_bar" style="width:0%; height:100%; background:var(--pri); transition:width 0.2s;"></div>
      </div>
      <p id="import_status_text" style="font-size:12px; color:var(--mute); text-align:center; margin-top:5px;">Processing...</p>
    </div>

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button id="import_btn" class="btn" style="flex:1;" onclick="processBulkImport()">Import Numbers</button>
      <button id="cancel_btn" class="btn sec" style="flex:1;" onclick="modal()">Cancel</button>
    </div>
  `;
  modal(html);
}

async function processBulkImport() {
  if(isImporting) return;
  
  const rawText = v('bulk_text').trim();
  const type = v('bulk_type');
  
  if(!rawText) return alert('Please paste some numbers');

  const tokens = rawText.split(/[\s,;]+/);
  let validNumbers = [];
  
  tokens.forEach(token => {
    let clean = token.replace(/[^0-9]/g, '');
    if(!clean) return;
    
    if (clean.length === 12 && clean.startsWith('92')) clean = '0' + clean.substring(2);
    else if (clean.length === 14 && clean.startsWith('0092')) clean = '0' + clean.substring(4);
    else if (clean.length === 10 && clean.startsWith('3')) clean = '0' + clean;

    if (clean.length === 11 && clean.startsWith('03')) validNumbers.push(clean);
  });

  validNumbers = [...new Set(validNumbers)];

  if(validNumbers.length === 0) return alert('❌ No valid numbers found.');

  isImporting = true;
  document.getElementById('import_progress_box').style.display = 'block';
  document.getElementById('import_btn').disabled = true;
  document.getElementById('import_btn').innerText = 'Importing...';
  document.getElementById('cancel_btn').disabled = true;

  let successCount = 0;
  let duplicateCount = 0;
  let errorCount = 0;
  const BATCH_SIZE = 100;
  const totalBatches = Math.ceil(validNumbers.length / BATCH_SIZE);

  for (let i = 0; i < validNumbers.length; i += BATCH_SIZE) {
    const batch = validNumbers.slice(i, i + BATCH_SIZE);
    
    const batchData = batch.map(phone => ({
      name: 'Unknown', phone: phone, type: type, added_by: me.username, verify_status: 'Active'
    }));

    try {
      const { data, error } = await supabaseClient.from('customers').insert(batchData).select();
      
      if (error) {
        for (let phone of batch) {
          const { error: singleErr } = await supabaseClient.from('customers').insert([{
            name: 'Unknown', phone: phone, type: type, added_by: me.username, verify_status: 'Active'
          }]);
          if (singleErr) {
            if (singleErr.code === '23505') duplicateCount++;
            else errorCount++;
          } else {
            successCount++;
          }
        }
      } else {
        successCount += data.length;
      }
    } catch (e) {
      errorCount += batch.length;
    }

    const currentBatch = Math.floor(i / BATCH_SIZE) + 1;
    const percent = Math.round((currentBatch / totalBatches) * 100);
    document.getElementById('import_progress_bar').style.width = percent + '%';
    document.getElementById('import_status_text').innerText = `Saving ${currentBatch * BATCH_SIZE} / ${validNumbers.length} numbers... (${percent}%)`;
  }

  isImporting = false;
  alert(`✅ Import Complete!\n\n${successCount} numbers imported\n${duplicateCount} duplicates skipped\n${errorCount} errors`);
  
  modal();
  loadCustomers();
}

// --- CSV UPLOAD FEATURE ---
function openCsvImport() {
  let html = `
    <h3 style="margin-bottom:15px; border-bottom:1px solid #ccc; padding-bottom:10px;">Upload CSV (Google Sheet Export)</h3>
    <p style="font-size:12px; color:gray; margin-bottom:10px;">
      1. Apni Google Sheet ko File > Download > CSV mein save karein.<br>
      2. Us CSV file ko yahan upload karein.<br>
      3. Sirf <b>1 column</b> mein numbers hon (03xx format).
    </p>
    
    <label>Select CSV File</label>
    <input type="file" id="csv_file" accept=".csv" style="padding:10px; background:#fff; border:1px dashed var(--pri);">

    <label>Type</label>
    <select id="csv_type">
      <option value="WhatsApp Lead">WhatsApp Lead (Call History)</option>
      <option value="Marketing">Marketing List</option>
      <option value="Installment">Installment Customer</option>
    </select>

    <div id="csv_progress_box" style="display:none; margin-top:15px;">
      <div style="background:#e2e8f0; height:8px; border-radius:4px; overflow:hidden;">
        <div id="csv_progress_bar" style="width:0%; height:100%; background:var(--pri); transition:width 0.2s;"></div>
      </div>
      <p id="csv_status_text" style="font-size:12px; color:var(--mute); text-align:center; margin-top:5px;">Processing...</p>
    </div>

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button id="csv_import_btn" class="btn" style="flex:1;" onclick="processCsvImport()">Upload & Import</button>
      <button id="csv_cancel_btn" class="btn sec" style="flex:1;" onclick="modal()">Cancel</button>
    </div>
  `;
  modal(html);
}

async function processCsvImport() {
  if(isImporting) return;
  
  const fileInput = document.getElementById('csv_file');
  const type = v('csv_type');
  
  if (!fileInput.files || fileInput.files.length === 0) {
    return alert('Please select a CSV file.');
  }
  
  const file = fileInput.files[0];
  
  isImporting = true;
  document.getElementById('csv_progress_box').style.display = 'block';
  document.getElementById('csv_import_btn').disabled = true;
  document.getElementById('csv_import_btn').innerText = 'Uploading...';
  document.getElementById('csv_cancel_btn').disabled = true;

  const reader = new FileReader();
  
  reader.onload = async function(e) {
    const text = e.target.result;
    
    const tokens = text.split(/[\r\n,;]+/);
    let validNumbers = [];
    
    tokens.forEach(token => {
      let clean = token.replace(/[^0-9]/g, '');
      if(!clean) return;
      
      if (clean.length === 12 && clean.startsWith('92')) clean = '0' + clean.substring(2);
      else if (clean.length === 14 && clean.startsWith('0092')) clean = '0' + clean.substring(4);
      else if (clean.length === 10 && clean.startsWith('3')) clean = '0' + clean;

      if (clean.length === 11 && clean.startsWith('03')) validNumbers.push(clean);
    });

    validNumbers = [...new Set(validNumbers)];

    if(validNumbers.length === 0) {
      isImporting = false;
      alert('❌ CSV file mein koi valid number nahi mila. Format 03xx-xxxxxxx hona chahiye.');
      modal();
      return;
    }

    let successCount = 0;
    let duplicateCount = 0;
    let errorCount = 0;
    const BATCH_SIZE = 100;
    const totalBatches = Math.ceil(validNumbers.length / BATCH_SIZE);

    for (let i = 0; i < validNumbers.length; i += BATCH_SIZE) {
      const batch = validNumbers.slice(i, i + BATCH_SIZE);
      
      const batchData = batch.map(phone => ({
        name: 'Unknown', phone: phone, type: type, added_by: me.username, verify_status: 'Active'
      }));

      try {
        const { data, error } = await supabaseClient.from('customers').insert(batchData).select();
        
        if (error) {
          for (let phone of batch) {
            const { error: singleErr } = await supabaseClient.from('customers').insert([{
              name: 'Unknown', phone: phone, type: type, added_by: me.username, verify_status: 'Active'
            }]);
            if (singleErr) {
              if (singleErr.code === '23505') duplicateCount++;
              else errorCount++;
            } else {
              successCount++;
            }
          }
        } else {
          successCount += data.length;
        }
      } catch (e) {
        errorCount += batch.length;
      }

      const currentBatch = Math.floor(i / BATCH_SIZE) + 1;
      const percent = Math.round((currentBatch / totalBatches) * 100);
      document.getElementById('csv_progress_bar').style.width = percent + '%';
      document.getElementById('csv_status_text').innerText = `Saving ${currentBatch * BATCH_SIZE} / ${validNumbers.length} numbers... (${percent}%)`;
    }

    isImporting = false;
    alert(`✅ CSV Import Complete!\n\n${successCount} numbers imported\n${duplicateCount} duplicates skipped\n${errorCount} errors`);
    
    modal();
    loadCustomers();
  };
  
  reader.readAsText(file);
}

loadCustomers();
</script>
</body>
</html>
