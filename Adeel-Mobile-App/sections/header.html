<div class="store-header" style="position: relative;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
    
    <!-- Left Side: Logo / Name -->
    <div style="text-align: left;">
      <h1 class="store-logo-3d">Adeel Mobile</h1>
      <p style="margin:0; font-size: 12px; color: #64748b;">Your Trusted Mobile Store</p>
    </div>

    <!-- Right Side: Features Button -->
    <div class="features-dropdown-wrapper" style="position:relative;">
      <button class="features-btn" onclick="toggleFeaturesMenu()">Features ▼</button>
      <div id="featuresMenu" class="features-menu">
        <button onclick="openBudgetCalculator()">🧮 Budget Calculator</button>
        <button onclick="openPriceList()">📋 Price List</button>
      </div>
    </div>
    
  </div>
</div>
