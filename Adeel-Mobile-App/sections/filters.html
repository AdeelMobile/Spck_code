<div class="price-filters">
  <button class="price-btn active" onclick="filterByRange(0, 999999, this)">All</button>
  <button class="price-btn" onclick="filterByRange(1, 10000, this)">10,000</button>
  <button class="price-btn" onclick="filterByRange(10001, 20000, this)">20,000</button>
  <button class="price-btn" onclick="filterByRange(20001, 30000, this)">30,000</button>
  <button class="price-btn" onclick="filterByRange(30001, 40000, this)">40,000</button>
  <button class="price-btn" onclick="filterByRange(40001, 50000, this)">50,000</button>
  <button class="price-btn" onclick="filterByRange(50001, 60000, this)">60,000</button>
  <button class="price-btn" onclick="filterByRange(60001, 70000, this)">70,000</button>
  <button class="price-btn" onclick="filterByRange(70001, 80000, this)">80,000</button>
  <button class="price-btn" onclick="filterByRange(80001, 90000, this)">90,000</button>
  <button class="price-btn" onclick="filterByRange(90001, 100000, this)">100,000</button>
</div>

<script>
  // Ye script filter buttons ko chalane ke liye hai
  function filterByRange(min, max, btn) {
    document.querySelectorAll('.price-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cards = document.querySelectorAll('.p-card');
    cards.forEach(c => {
      const price = parseInt(c.getAttribute('data-price'));
      if (price >= min && price <= max) { c.style.display = 'flex'; }
      else { c.style.display = 'none'; }
    });
  }
</script>
