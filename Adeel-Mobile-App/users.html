<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Users - Adeel Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .u-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .u-tabs::-webkit-scrollbar { display: none; }
  .u-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .u-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  .u-panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .u-panel.active { display: block; }
  
  .u-panel h3 { font-size: 16px; color: var(--ink); margin-bottom: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }

  .u-search { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); margin-bottom: 15px; font-size: 14px; outline: none; }
  .u-search:focus { border-color: var(--pri); }

  .user-card { 
    display: flex; flex-direction: column;
    padding: 15px; border: 1px solid var(--line); border-radius: 12px; 
    background: var(--bg); margin-bottom: 12px; cursor: pointer; transition: 0.2s; 
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .user-card:active { background: #fff; border-color: var(--pri); }
  
  .user-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
  .user-info b { display: block; font-size: 15px; color: var(--ink); }
  .user-info small { display: block; font-size: 12px; color: var(--mute); margin-top: 2px; }
  
  .user-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
  .stat-box { background: #fff; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .stat-box span { color: var(--mute); display: block; font-size: 10px; margin-bottom: 2px; }
  .stat-box b { color: var(--ink); font-size: 13px; }
  
  .progress-wrap { margin-top: 8px; background: #e2e8f0; border-radius: 4px; height: 6px; overflow: hidden; width: 100%; }
  .progress-bar { height: 100%; background: var(--ok); width: 0%; transition: width 0.3s ease; }

  .user-status { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
  .user-status.active { background: var(--ok); color: #fff; }
  .user-status.blocked { background: var(--bad); color: #fff; }

  .brand-profit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .brand-profit-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
  .brand-profit-item span { font-size: 13px; font-weight: 600; color: var(--ink); }
  .brand-profit-item input { width: 60px; padding: 6px; margin: 0; text-align: center; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='user-dashboard.html';

let currentTab = 'all'; 
let activeBrands = []; 
let allUsers = [];
let userSearch = ''; 
let editUserId = null; 
let pressTimer; 

async function fetchData() {
  try {
    // Brands fetch karo
    const { data: brands } = await supabaseClient.from('brands').select('id, brand').eq('is_active', true);
    activeBrands = brands || [];

    // Users fetch karo
    const { data: users } = await supabaseClient.from('users').select('*').neq('role', 'admin').order('name');
    allUsers = users || [];
  } catch (err) {
    console.error(err);
  }
}

function getUserListHtml() {
  const filteredUsers = allUsers.filter(u => 
    (u.name && u.name.toLowerCase().includes(userSearch.toLowerCase())) || 
    (u.login_username && u.login_username.toLowerCase().includes(userSearch.toLowerCase()))
  );

  return filteredUsers.map(u => {
    const userSales = (D.sales || []).filter(s => s.userId === u.id);
    const totalSaleAmount = userSales.reduce((sum, s) => sum + s.total, 0);
    const wallet = u.wallet || 0;
    
    let percent = 0;
    if (u.sale_target > 0) {
      percent = Math.round((totalSaleAmount / u.sale_target) * 100);
      if(percent > 100) percent = 100;
    }

    return `
    <div class="user-card" 
         onmousedown="startUserPress('${u.id}')" 
         onmouseup="cancelPress()" onmouseleave="cancelPress()"
         ontouchstart="startUserPress('${u.id}')" 
         ontouchend="cancelPress()" ontouchcancel="cancelPress()">
      
      <div class="user-card-top">
        <div class="user-info">
          <b>${esc(u.name)}</b>
          <small>@${esc(u.login_username)} | ${esc(u.contact || 'No Phone')}</small>
        </div>
        <div class="user-status active">Active</div>
      </div>

      <div class="user-stats-grid">
        <div class="stat-box">
          <span>Target (Rs)</span>
          <b>${rs(u.sale_target || 0)}</b>
        </div>
        <div class="stat-box">
          <span>Achieved (Rs)</span>
          <b style="color:var(--pri)">${rs(totalSaleAmount)}</b>
        </div>
        <div class="stat-box">
          <span>Total Sale</span>
          <b>${rs(totalSaleAmount)}</b>
        </div>
        <div class="stat-box">
          <span>Wallet Balance</span>
          <b style="color:var(--ok)">${rs(wallet)}</b>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; font-size:11px; margin-top:8px; color:var(--mute);">
        <span>Performance: <b>${percent}%</b></span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" style="width: ${percent}%;"></div>
      </div>
    </div>
    `;
  }).join('') || '<p style="text-align:center; color:var(--mute);">No users found.</p>';
}

function startUserPress(id) {
  pressTimer = setTimeout(() => {
    startEditUser(id); 
  }, 600); 
}

function cancelPress() {
  clearTimeout(pressTimer);
}

function handleSearch(val) {
  userSearch = val;
  const listContainer = document.getElementById('userListContainer');
  if(listContainer) {
    listContainer.innerHTML = getUserListHtml();
  }
}

async function loadUsers() {
  await fetchData();

  const editUserObj = editUserId ? allUsers.find(u => String(u.id) === String(editUserId)) : null;
  
  const vName = editUserObj ? esc(editUserObj.name) : '';
  const vUser = editUserObj ? esc(editUserObj.login_username) : '';
  const vPass = editUserObj ? esc(editUserObj.pass) : '';
  const vPhone = editUserObj ? esc(editUserObj.contact) : '';
  const vTarget = editUserObj ? editUserObj.sale_target : '';

  let html = `
  <div class="top"><h2>Users Management</h2></div>
  
  <div class="u-tabs">
    <button class="u-tab-btn ${currentTab==='all'?'active':''}" onclick="switchTab('all')">👥 All Users</button>
    <button class="u-tab-btn ${currentTab==='create'?'active':''}" onclick="switchTab('create')">➕ ${editUserId ? 'Edit User' : 'Create User'}</button>
  </div>

  <div class="u-panel ${currentTab==='all'?'active':''}">
    <h3>All Users</h3>
    <input type="text" class="u-search" id="searchUser" placeholder="Search by name or username..." oninput="handleSearch(this.value)" value="${esc(userSearch)}">
    
    <div id="userListContainer">
      ${getUserListHtml()}
    </div>
  </div>

  <div class="u-panel ${currentTab==='create'?'active':''}">
    <h3>${editUserId ? 'Edit User' : 'Create User'}</h3>
    <label>Full Name</label>
    <input id="u_name" value="${vName}">
    
    <label>Username</label>
    <input id="u_username" value="${vUser}">
    
    <label>Password</label>
    <input id="u_pass" type="text" value="${vPass}">
    
    <label>Phone / WhatsApp</label>
    <input id="u_phone" value="${vPhone}">
    
    <label>Monthly Target (Rs)</label>
    <input id="u_target" type="number" value="${vTarget}">
    
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn" style="flex:1;" onclick="saveUser()">${editUserId ? 'Update User' : 'Save User'}</button>
      ${editUserId ? `<button class="btn sec" style="flex:1;" onclick="cancelEdit()">Cancel</button>` : ''}
    </div>
  </div>
  `;

  renderApp('Users', html);
}

function switchTab(tab) {
  currentTab = tab;
  if(tab !== 'create') {
    editUserId = null; 
  }
  loadUsers();
}

function startEditUser(id) {
  editUserId = id; 
  currentTab = 'create'; 
  loadUsers();
}

function cancelEdit() {
  editUserId = null; 
  currentTab = 'all'; 
  loadUsers();
}

async function saveUser() {
  const name = v('u_name').trim();
  const un = v('u_username').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const pass = v('u_pass').trim();
  const phone = v('u_phone').trim();
  const target = +v('u_target') || 0;

  if(!name || !un || !pass) return alert('Name, username and password are required');
  
  try {
    if (editUserId) {
      // UPDATE
      const { error } = await supabaseClient.from('users').update({
        name: name,
        login_username: un,
        pass: pass,
        contact: phone,
        sale_target: target
      }).eq('id', editUserId);
      
      if(error) throw error;
      alert('User updated successfully!');
    } else {
      // CREATE
      const { error } = await supabaseClient.from('users').insert([{
        name: name,
        login_username: un,
        pass: pass,
        contact: phone,
        sale_target: target,
        role: 'user',
        status: 'active'
      }]);
      
      if(error) throw error;
      alert('User created successfully!');
    }
    
    editUserId = null;
    switchTab('all');
    
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

loadUsers();
</script>
</body>
</html>
