<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sale / Purchase - Adeel Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';

const isAdmin = me.role === 'admin';
let currentType = 'sale'; 
let selectedCustomer = null;

function loadNewSale(){
  const P = D.products.filter(p=>p.stock>0 || currentType==='purchase');
  
  if(!P.length && currentType==='sale' && isAdmin){
    return renderApp('Sale / Purchase', `<div class="top"><h2>Create Sale / Purchase</h2></div>
    <div class="card"><p style="color:var(--bad)">Stock is empty. Please Purchase or add a phone in Products.</p></div>`);
  }

  let html = `<div class="top"><h2>Create Sale / Purchase</h2></div>`;

  if(isAdmin) {
    html += `
    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <button class="btn ${currentType==='sale'?'':'sec'}" style="flex:1" onclick="currentType='sale';selectedCustomer=null;loadNewSale()">Sale</button>
      <button class="btn ${currentType==='purchase'?'':'sec'}" style="flex:1" onclick="currentType='purchase';selectedCustomer=null;loadNewSale()">Purchase</button>
    </div>

    <div class="card" style="max-width:520px">
      <label>Phone</label>
      <select id="ns_p">
        <option value="">-- Select Phone --</option>
        ${P.map(p=>`<option value="${p.id}">${esc(p.brand+' '+p.name)} – Price: ${rs(p.price)} (Stock: ${p.stock})</option>`).join('')}
        ${currentType==='purchase' ? `<option value="new">+ Add New Phone (New Purchase)</option>` : ''}
      </select>
      
      <div id="newProdBox" style="display:none; margin-top:10px; padding:12px; background:var(--bg); border-radius:10px; border:1px solid var(--line);">
        <label>New Phone Brand</label><input id="np_brand" placeholder="e.g. Samsung">
        <label>New Phone Model</label><input id="np_name" placeholder="e.g. A15 128GB">
        <label>Purchase Price (Rs)</label><input id="np_price" type="number" placeholder="0">
      </div>

      ${currentType === 'sale' ? `
        <label>Customer Details</label>
        <button class="btn sec" style="width:100%; margin-bottom:10px;" onclick="showApprovedCustomers()">Select Approved Customer</button>
        ${selectedCustomer ? `<div style="font-size:12px; color:var(--pri); margin-bottom:8px;">Verified By Agent: <b>${esc(getAgentName(selectedCustomer.userId))}</b></div>` : ''}
        <div class="row">
          <div><input id="ns_n" value="${selectedCustomer ? esc(selectedCustomer.cname) : ''}" placeholder="Customer Name" readonly style="background:var(--bg);"></div>
          <div><input id="ns_t" value="${selectedCustomer ? esc(selectedCustomer.cphone) : ''}" placeholder="Customer Phone" readonly style="background:var(--bg);"></div>
        </div>
      ` : `
        <div class="row">
          <div><label>Supplier Name</label><input id="ns_n" placeholder="Supplier Name"></div>
          <div><label>Supplier Phone</label><input id="ns_t" placeholder="Supplier Phone"></div>
        </div>
        <label>Paid Amount (Rs)</label>
        <input id="ns_a" type="number" value="0">
      `}
      
      <button class="btn" style="margin-top:14px; width:100%" onclick="saveSale()">
        ${currentType==='sale' ? 'Create Invoice / Save Sale' : 'Save Purchase'}
      </button>
    </div>
    `;
  }

  html += `
  <div class="top" style="margin-top:30px;">
    <h3>${currentType === 'sale' ? (isAdmin ? 'All Sales List' : 'My Sales') : 'All Purchases List'}</h3>
  </div>
  
  <div class="tw"><table>
    <tr>
      <th>Date</th>
      <th>${currentType === 'sale' ? 'Customer' : 'Supplier'}</th>
      ${currentType === 'sale' && isAdmin ? '<th>Agent</th>' : ''}
      <th>Phone Model</th>
      <th>Price</th>
      ${currentType === 'purchase' ? '<th>Paid / Remaining</th>' : ''}
      ${isAdmin ? '<th>Actions</th>' : ''}
    </tr>
    ${currentType === 'sale' ? 
      (D.sales.slice().reverse().filter(s => isAdmin || s.userId === me.id).map(s=>`<tr>
        <td>${new Date(s.date).toLocaleDateString('en-GB')}</td>
        <td>${esc(s.cname)}<br><small style="color:var(--mute)">${esc(s.cphone)}</small></td>
        ${isAdmin ? `<td>${esc(getAgentName(s.userId))}</td>` : ''}
        <td>${esc(s.pname)}</td>
        <td>${rs(s.total)}</td>
        ${isAdmin ? `<td>
          <button class="btn sm sec" onclick="editSale('${s.id}')">Edit</button>
          <button class="btn sm red" onclick="deleteSale('${s.id}')">Delete</button>
        </td>` : ''}
      </tr>`).join('') || `<tr><td colspan="${isAdmin?6:5}" style="text-align:center;color:var(--mute)">No sales found.</td></tr>`)
      :
      (D.purchases.slice().reverse().map(p=>`<tr>
        <td>${new Date(p.date).toLocaleDateString('en-GB')}</td>
        <td>${esc(p.sname)}<br><small style="color:var(--mute)">${esc(p.sphone)}</small></td>
        ${isAdmin ? `<td>${esc(getAgentName(p.userId))}</td>` : ''}
        <td>${esc(p.pname)}</td>
        <td>${rs(p.total)}</td>
        <td style="color:var(--mute); font-size:12px;">Paid: ${rs(p.paid)}<br>Rem: ${rs(p.remaining)}</td>
        ${isAdmin ? `<td>
          <button class="btn sm sec" onclick="editPurchase('${p.id}')">Edit</button>
          <button class="btn sm red" onclick="deletePurchase('${p.id}')">Delete</button>
        </td>` : ''}
      </tr>`).join('') || `<tr><td colspan="${isAdmin?7:6}" style="text-align:center;color:var(--mute)">No purchases found.</td></tr>`)
    }
  </table></div>
  `;

  renderApp('Sale / Purchase', html);

  if(isAdmin && P[0]) {
    document.getElementById('ns_p').value = P[0].id;
    document.getElementById('ns_p').addEventListener('change', function() {
      document.getElementById('newProdBox').style.display = this.value === 'new' ? 'block' : 'none';
    });
  }
}

function getAgentName(userId) {
  const u = D.users.find(x => x.id === userId);
  return u ? u.name : 'Unknown';
}

// Approved Customers List (Sirf wo jo sale nahi huay)
function showApprovedCustomers(){
  // Filter: Status Approved ho AUR 'used' true na ho
  const approved = D.verifications.filter(v => v.status === 'Approved' && !v.used);
  
  let listHtml = `<h3>Select Approved Customer</h3>
  <div style="max-height:300px; overflow-y:auto; margin-top:15px; display:flex; flex-direction:column; gap:8px;">`;
  
  if(approved.length === 0){
    listHtml += `<p style="color:var(--mute)">No approved (and unused) verifications found.</p>`;
  } else {
    approved.forEach(v => {
      listHtml += `
        <div style="border:1px solid var(--line); padding:12px; border-radius:8px; cursor:pointer; background:var(--card);" onclick="selectCustomer('${v.id}')">
          <b style="display:block; color:var(--ink);">${esc(v.cname)}</b>
          <span style="font-size:13px; color:var(--mute);">${esc(v.cphone)}</span>
          <span style="font-size:11px; color:var(--pri); display:block; margin-top:4px;">Agent: ${esc(getAgentName(v.userId))}</span>
        </div>
      `;
    });
  }
  listHtml += `</div><div style="margin-top:15px; text-align:right;"><button class="btn sec" onclick="modal()">Close</button></div>`;
  modal(listHtml);
}

function selectCustomer(id){
  selectedCustomer = D.verifications.find(v => v.id === id);
  modal(); 
  loadNewSale(); 
}

function saveSale(){
  if(!isAdmin) return alert("Access Denied");
  const pid = v('ns_p');
  let p, newBrand = '', newName = '', newPrice = 0;

  if(currentType === 'purchase' && pid === 'new') {
    newBrand = v('np_brand').trim();
    newName = v('np_name').trim();
    newPrice = +v('np_price');
    if(!newBrand || !newName || !newPrice) return alert('Please enter new phone brand, model and price.');
    
    p = { id: uid(), brand: newBrand, name: newName, price: newPrice, stock: 0, img: '' };
    D.products.push(p);
  } else {
    p = D.products.find(x=>x.id==pid);
  }

  if(!p) return alert('Please select a phone');
  
  const cname = v('ns_n').trim(), cphone = v('ns_t').trim();
  if(!cname) return alert('Please select/enter ' + (currentType==='sale'?'Customer':'Supplier') + ' details');

  if(currentType === 'sale') {
    D.sales.push({
      id:uid(), userId:me.id, productId:p.id, pname:p.brand+' '+p.name,
      cname, cphone, price:p.price, advance:0, months:0, markup:0, total:p.price, monthly:0,
      payments:[], date:Date.now()
    });
    p.stock--;

    // 👇 Yahan hum us Verification ko "Used" mark kar rahe hain
    if (selectedCustomer) {
      const vIndex = D.verifications.findIndex(v => v.id === selectedCustomer.id);
      if (vIndex !== -1) {
        D.verifications[vIndex].used = true; // Ab ye list me nahi aayega
      }
    }

  } else {
    const a = +v('ns_a') || 0;
    D.purchases.push({
      id:uid(), userId:me.id, productId:p.id, pname:p.brand+' '+p.name,
      sname:cname, sphone:cphone, price:p.price, paid:a, total:p.price, remaining:p.price - a, date:Date.now()
    });
    p.stock++;

    if(a > 0) {
      D.cashbook.push({
        id: uid(), date: Date.now(), type: 'Out', amount: a,
        description: `Purchase Paid - ${cname} (${p.brand} ${p.name})`, refId: p.id
      });
    }
  }
  
  save();
  selectedCustomer = null; 
  loadNewSale();
}

function deleteSale(id){
  if(!isAdmin) return;
  if(confirm('Are you sure you want to delete this sale? Stock will be restored.')) {
    const sale = D.sales.find(s => s.id === id);
    if(sale) {
      const p = D.products.find(x => x.id === sale.productId);
      if(p) p.stock++;
      
      // Optional: Agar sale delete ho, to verification wapis 'unused' ho jaye
      if(sale.cphone) {
         const v = D.verifications.find(v => v.cphone === sale.cphone && v.used);
         if(v) v.used = false; 
      }

      D.sales = D.sales.filter(s => s.id !== id);
      save(); loadNewSale();
    }
  }
}

function editSale(id){
  if(!isAdmin) return;
  const sale = D.sales.find(s => s.id === id);
  if(!sale) return;
  modal(`<h3>Edit Sale</h3>
  <label>Customer Name</label><input id="ed_cname" value="${esc(sale.cname)}">
  <label>Customer Phone</label><input id="ed_cphone" value="${esc(sale.cphone)}">
  <label>Total Amount (Rs)</label><input id="ed_total" type="number" value="${sale.total}">
  <div style="margin-top:15px; display:flex; gap:10px;">
    <button class="btn" onclick="saveEditSale('${id}')">Save Changes</button>
    <button class="btn sec" onclick="modal()">Cancel</button>
  </div>`);
}

function saveEditSale(id){
  const sale = D.sales.find(s => s.id === id);
  if(sale) {
    sale.cname = v('ed_cname').trim();
    sale.cphone = v('ed_cphone').trim();
    sale.total = +v('ed_total');
    save(); modal(); loadNewSale();
  }
}

function deletePurchase(id){
  if(!isAdmin) return;
  if(confirm('Are you sure you want to delete this purchase? Stock will be reduced.')) {
    const pur = D.purchases.find(p => p.id === id);
    if(pur) {
      const p = D.products.find(x => x.id === pur.productId);
      if(p) p.stock--;
      D.purchases = D.purchases.filter(p => p.id !== id);
      save(); loadNewSale();
    }
  }
}

function editPurchase(id){
  if(!isAdmin) return;
  const pur = D.purchases.find(p => p.id === id);
  if(!pur) return;
  modal(`<h3>Edit Purchase</h3>
  <label>Supplier Name</label><input id="ep_sname" value="${esc(pur.sname)}">
  <label>Supplier Phone</label><input id="ep_sphone" value="${esc(pur.sphone)}">
  <label>Paid Amount (Rs)</label><input id="ep_paid" type="number" value="${pur.paid}">
  <div style="margin-top:15px; display:flex; gap:10px;">
    <button class="btn" onclick="saveEditPurchase('${id}')">Save Changes</button>
    <button class="btn sec" onclick="modal()">Cancel</button>
  </div>`);
}

function saveEditPurchase(id){
  const pur = D.purchases.find(p => p.id === id);
  if(pur) {
    pur.sname = v('ep_sname').trim();
    pur.sphone = v('ep_sphone').trim();
    pur.paid = +v('ep_paid');
    pur.remaining = pur.total - pur.paid;
    save(); modal(); loadNewSale();
  }
}

loadNewSale();
</script>
</body>
</html>
