<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Agents - Adeel Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .ai-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .ai-tabs::-webkit-scrollbar { display: none; }
  .ai-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
  }
  .ai-tab-btn:hover { border-color: var(--pri); }
  .ai-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  .ai-panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .ai-panel.active { display: block; }
  .ai-panel h3 { font-size: 16px; color: var(--ink); margin-bottom: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

let currentTab = 'priceupdate';

function loadPage() {
  let html = `
  <div class="top"><h2>AI Agents</h2></div>
  
  <div class="ai-tabs">
    <button class="ai-tab-btn ${currentTab==='priceupdate'?'active':''}" onclick="switchTab('priceupdate')">🤖 Price Updates Agent</button>
  </div>

  <div class="ai-panel ${currentTab==='priceupdate'?'active':''}">
    <h3>Price Updates Agent</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>
  `;

  renderApp('AI Agents', html);
}

function switchTab(tab) {
  currentTab = tab;
  loadPage();
}

loadPage();
</script>
</body>
</html>
