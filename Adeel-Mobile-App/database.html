<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Database - Adeel Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Top Buttons (Tabs) */
  .db-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .db-tabs::-webkit-scrollbar { display: none; }
  .db-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .db-tab-btn:hover { border-color: var(--pri); }
  .db-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  /* Panels */
  .db-panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .db-panel.active { display: block; }
  .db-panel h3 { font-size: 16px; color: var(--ink); margin-bottom: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }

  /* Brands List */
  .brand-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
  .brand-tag { 
    background: var(--pri2); color: var(--pri); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; 
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; transition: 0.2s;
  }
  .brand-tag:active { background: var(--line); }

  /* Search Bar */
  .db-search { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); margin-bottom: 15px; font-size: 14px; outline: none; }
  .db-search:focus { border-color: var(--pri); }

  /* Product List for Price Update */
  .price-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
  .price-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; transition: 0.2s; }
  .price-item:hover { border-color: var(--pri); background: #fff; }
  .price-item-info b { display: block; font-size: 14px; color: var(--ink); }
  .price-item-info small { display: block; font-size: 12px; color: var(--mute); margin-top: 2px; }
  .price-item-amount { font-weight: 700; color: var(--pri); font-size: 15px; }

  /* --- Image Upload CSS --- */
  .image-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px; }
  .img-preview-box { position: relative; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #f0f0f0; }
  .img-preview-box.cover-selected { border-color: var(--pri); box-shadow: 0 0 5px rgba(0,0,0,0.2); }
  .img-preview-box img { width: 100%; height: 100%; object-fit: cover; }
  .cover-badge { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; text-align: center; padding: 3px 0; cursor: pointer; }
  .cover-selected .cover-badge { background: var(--pri); }
  .upload-loading { text-align: center; color: var(--pri); font-weight: bold; margin-top: 10px; display: none; }
  
  /* Modal Specific */
  .modal-content { max-height: 85vh; overflow-y: auto; padding-bottom: 20px; }
  .action-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
  .action-btn:active { background: var(--bg); }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

let currentTab = 'brand'; 
let priceSearch = '';
let allBrands = [];
let allModels = [];
let allVariants = [];
let pressTimer; // Brand edit long press ke liye (pehle se chal raha hai)

// Variables for Add/Edit Images
let selectedFiles = []; 
let previewUrls = [];   
let coverIndex = 0;     

async function fetchDatabaseData() {
  try {
    const { data: brands } = await supabaseClient.from('brands').select('*');
    const { data: models } = await supabaseClient.from('models').select('*');
    const { data: variants } = await supabaseClient.from('variants').select('*');
    allBrands = brands || [];
    allModels = models || [];
    allVariants = variants || [];
  } catch (err) {
    console.error(err);
    alert("Data fetch error: " + err.message);
  }
}

async function loadDatabase() {
  await fetchDatabaseData(); 

  let html = `
  <div class="top"><h2>Master Database</h2></div>
  
  <div class="db-tabs">
    <button class="db-tab-btn ${currentTab==='brand'?'active':''}" onclick="switchTab('brand')">🏷️ Add Brand</button>
    <button class="db-tab-btn ${currentTab==='model'?'active':''}" onclick="switchTab('model')">📱 Add Model</button>
    <button class="db-tab-btn ${currentTab==='bulk'?'active':''}" onclick="switchTab('bulk')">📦 Bulk Upload</button>
    <button class="db-tab-btn ${currentTab==='price'?'active':''}" onclick="switchTab('price')">💰 Update Product</button>
  </div>

  <!-- 1. Add Brand Panel -->
  <div class="db-panel ${currentTab==='brand'?'active':''}">
    <h3>Add New Brand</h3>
    <p style="font-size: 11px; color: var(--mute); margin-bottom: 10px;">(Tip: Brand par daba kar rakhne se Edit ka option milega)</p>
    <div style="display:flex; gap:10px;">
      <input id="new_brand" placeholder="e.g. Samsung, Apple">
      <button class="btn" onclick="addBrand()">Add</button>
    </div>
    <div class="brand-list">
      ${allBrands.map(b => `
        <div class="brand-tag" 
             onmousedown="startPress('${b.id}', '${esc(b.brand)}')" 
             onmouseup="cancelPress()" onmouseleave="cancelPress()"
             ontouchstart="startPress('${b.id}', '${esc(b.brand)}')" 
             ontouchend="cancelPress()" ontouchcancel="cancelPress()">
          ${esc(b.brand)}
        </div>
      `).join('')}
    </div>
  </div>

  <!-- 2. Add Model Panel -->
  <div class="db-panel ${currentTab==='model'?'active':''}">
    <h3>Add New Model & Variant</h3>
    <label>Select Brand</label>
    <select id="m_brand">
      ${allBrands.map(b => `<option value="${b.id}">${esc(b.brand)}</option>`).join('') || '<option value="">No brands added yet</option>'}
    </select>
    <label>Model Name</label>
    <input id="m_name" placeholder="e.g. Galaxy A15">
    <label>Variant (RAM/Storage)</label>
    <input id="m_variant" placeholder="e.g. 8GB/128GB">
    <label>Price (Rs)</label>
    <input id="m_price" type="number" placeholder="0">
    
    <label>Product Images (Multiple select karein)</label>
    <input type="file" id="m_images" accept="image/*" multiple onchange="handleImageSelect(event, 'add')" style="padding: 10px; background: #fff; border: 1px dashed var(--pri);">
    <div id="add_image_preview" class="image-preview-grid"></div>
    <p id="add_upload_status" class="upload-loading">Uploading images, please wait...</p>

    <button class="btn" style="margin-top:15px; width:100%" onclick="addModel()">Save Model</button>
  </div>

  <!-- 3. Bulk Upload Panel -->
  <div class="db-panel ${currentTab==='bulk'?'active':''}">
    <h3>Bulk Upload (Coming Soon)</h3>
    <p class="hint">Filhal ye feature Supabase ke sath kaam nahi karta. Agli update mein aayega.</p>
  </div>

  <!-- 4. Price Update Panel (Now Update Product) -->
  <div class="db-panel ${currentTab==='price'?'active':''}">
    <h3>Update Products</h3>
    <p style="font-size: 11px; color: var(--mute); margin-bottom: 10px;">(Tip: Kisi bhi model par click karein Edit/Delete ke liye)</p>
    <input type="text" class="db-search" id="searchPrice" placeholder="Search model name..." oninput="priceSearch=this.value; loadDatabase()" value="${esc(priceSearch)}">
    
    <div class="price-list">
      ${allVariants
        .filter(v => {
          const model = allModels.find(m => m.id === v.model_id);
          if(!model) return false;
          return model.model.toLowerCase().includes(priceSearch.toLowerCase());
        })
        .map(v => {
          const model = allModels.find(m => m.id === v.model_id);
          return `
          <div class="price-item" onclick="openActionMenu('${v.id}')">
            <div class="price-item-info">
              <b>${esc(model.model)}</b>
              <small>Variant: ${esc(v.variant || 'N/A')}</small>
            </div>
            <div class="price-item-amount">${rs(v.price)}</div>
          </div>`;
        }).join('') || '<p style="text-align:center; color:var(--mute);">No models found.</p>'}
    </div>
  </div>
  `;

  renderApp('Database', html);
}

function switchTab(tab) {
  currentTab = tab;
  selectedFiles = [];
  previewUrls = [];
  coverIndex = 0;
  loadDatabase();
}

// --- Actions ---

async function addBrand() {
  const b = v('new_brand').trim();
  if(!b) return alert('Please enter a brand name');
  if(allBrands.some(x => x.brand.toLowerCase() === b.toLowerCase())) return alert('This brand already exists');
  
  try {
    const { error } = await supabaseClient.from('brands').insert([{ brand: b }]);
    if(error) throw error;
    alert('Brand added to Supabase!');
    loadDatabase();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

function startPress(id, currentName) {
  pressTimer = setTimeout(() => { editBrandPrompt(id, currentName); }, 600); 
}
function cancelPress() { clearTimeout(pressTimer); }

function editBrandPrompt(id, oldName) {
  let newName = prompt("Edit Brand Name:", oldName);
  if (newName !== null && newName.trim() !== "" && newName.trim() !== oldName) {
    updateBrandName(id, newName.trim());
  }
}

async function updateBrandName(id, newName) {
  try {
    const { error } = await supabaseClient.from('brands').update({ brand: newName }).eq('id', id);
    if(error) throw error;
    alert('Brand updated successfully!');
    loadDatabase();
  } catch (err) {
    alert('Error updating brand: ' + err.message);
  }
}

// --- ACTION MENU (Click par) ---
function openActionMenu(variantId) {
  const variant = allVariants.find(x => x.id === variantId);
  if(!variant) return;
  const model = allModels.find(m => m.id === variant.model_id);
  
  let html = `
    <div style="padding: 10px;">
      <h3 style="margin-bottom: 5px;">${esc(model ? model.model : 'Unknown')}</h3>
      <p style="color: gray; font-size: 13px; margin-bottom: 20px;">${esc(variant.variant || 'No Variant')} | Rs ${rs(variant.price)}</p>
      
      <button class="action-btn" onclick="openEditPopup('${variantId}')">✏️ Edit Product</button>
      <button class="action-btn" style="color: red;" onclick="deleteProduct('${variantId}')">❌ Delete Product</button>
      <button class="action-btn" style="text-align: center; margin-top: 10px; background: var(--bg);" onclick="modal()">Cancel</button>
    </div>
  `;
  modal(html);
}

// Delete Product Function
async function deleteProduct(variantId) {
  if(confirm("Kya aap waqai ye product delete karna chahte hain?")) {
    try {
      const { error } = await supabaseClient.from('variants').delete().eq('id', variantId);
      if(error) throw error;
      
      alert('Product deleted successfully!');
      modal(); // Close popup
      loadDatabase(); // Refresh list
    } catch(err) {
      alert('Error deleting product: ' + err.message);
    }
  }
}

// --- IMAGE HANDLING LOGIC ---

function handleImageSelect(event, type) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;

  selectedFiles = []; 
  previewUrls = [];
  
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxSize = 800; 

        if (width > height) {
          if (width > maxSize) { height *= maxSize / width; width = maxSize; }
        } else {
          if (height > maxSize) { width *= maxSize / height; height = maxSize; }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        canvas.toBlob((blob) => {
          const resizedFile = new File([blob], file.name, { type: 'image/jpeg' });
          selectedFiles.push(resizedFile);
          previewUrls.push(canvas.toDataURL('image/jpeg', 0.8)); 
          
          if (selectedFiles.length === files.length) {
            coverIndex = 0; 
            renderImagePreviews(type);
          }
        }, 'image/jpeg', 0.8);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderImagePreviews(type) {
  const containerId = type === 'add' ? 'add_image_preview' : 'edit_image_preview';
  const container = document.getElementById(containerId);
  if (!container) return;
  
  container.innerHTML = previewUrls.map((url, index) => `
    <div class="img-preview-box ${index === coverIndex ? 'cover-selected' : ''}">
      <img src="${url}" alt="preview">
      <div class="cover-badge" onclick="setCoverImage(${index}, '${type}')">
        ${index === coverIndex ? '⭐ Cover' : 'Set Cover'}
      </div>
    </div>
  `).join('');
}

function setCoverImage(index, type) {
  coverIndex = index;
  renderImagePreviews(type);
}

async function uploadImagesToSupabase() {
  let uploadedUrls = [];
  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
    
    const { data, error } = await supabaseClient.storage.from('product-images').upload(fileName, file);
    if (error) throw new Error("Image upload failed: " + error.message);
    
    const { data: urlData } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
    uploadedUrls.push(urlData.publicUrl);
  }
  return uploadedUrls;
}

// --- ADD MODEL ---
async function addModel() {
  const brandId = v('m_brand');
  const name = v('m_name').trim();
  const variant = v('m_variant').trim();
  const price = +v('m_price');

  if(!brandId || !name || price <= 0) return alert('Please fill Brand, Model Name and Price');

  const btn = document.querySelector('#root .db-panel.active button.btn'); 
  const statusEl = document.getElementById('add_upload_status');
  
  try {
    let finalImageUrl = "";
    if (selectedFiles.length > 0) {
      statusEl.style.display = 'block';
      btn.disabled = true;
      btn.innerText = "Uploading...";
      const urls = await uploadImagesToSupabase();
      finalImageUrl = urls[coverIndex] || urls[0];
    }

    let modelId = null;
    const existingModel = allModels.find(m => m.model.toLowerCase() === name.toLowerCase() && m.brand_id == brandId);
    
    if(existingModel) {
      modelId = existingModel.id;
    } else {
      const { data: newModel, error: mErr } = await supabaseClient.from('models').insert([{ brand_id: brandId, model: name }]).select();
      if(mErr) throw mErr;
      modelId = newModel[0].id;
    }

    const { error: vErr } = await supabaseClient.from('variants').insert([{
      model_id: modelId, variant: variant, price: price, image_link: finalImageUrl
    }]);
    if(vErr) throw vErr;

    alert('Model & Variant added successfully!');
    selectedFiles = []; previewUrls = []; coverIndex = 0;
    loadDatabase();

  } catch (err) {
    alert('Error: ' + err.message);
    btn.disabled = false;
    btn.innerText = "Save Model";
    statusEl.style.display = 'none';
  }
}

// --- EDIT PRODUCT POPUP ---
function openEditPopup(variantId) {
  const variant = allVariants.find(x => x.id === variantId);
  if(!variant) return;
  
  const model = allModels.find(m => m.id === variant.model_id);
  if(!model) return;
  
  const brand = allBrands.find(b => b.id === model.brand_id);
  
  // Reset global image variables for edit
  selectedFiles = [];
  previewUrls = [];
  coverIndex = 0;

  let html = `
    <div class="modal-content">
      <h3>Edit Product</h3>
      
      <label>Brand</label>
      <input value="${esc(brand ? brand.brand : 'Unknown')}" disabled style="background:#f0f0f0;">
      
      <label>Model Name</label>
      <input value="${esc(model.model)}" disabled style="background:#f0f0f0;">
      
      <label>Variant (RAM/Storage)</label>
      <input id="e_variant" value="${esc(variant.variant || '')}">
      
      <label>Price (Rs)</label>
      <input id="e_price" type="number" value="${variant.price}">
      
      <label>Current Image</label>
      <div style="margin-bottom:10px;">
         ${variant.image_link ? `<img src="${variant.image_link}" style="width:80px; height:80px; object-fit:cover; border-radius:8px; border:1px solid #ccc;">` : '<span style="font-size:12px; color:gray;">No image uploaded</span>'}
      </div>
      
      <label>Upload New Images (To replace)</label>
      <input type="file" accept="image/*" multiple onchange="handleImageSelect(event, 'edit')" style="padding: 10px; background: #fff; border: 1px dashed var(--pri);">
      <div id="edit_image_preview" class="image-preview-grid"></div>
      <p id="edit_upload_status" class="upload-loading">Uploading images, please wait...</p>

      <div style="margin-top:20px; display:flex; gap:10px;">
        <button class="btn" onclick="saveEditedProduct('${variant.id}', '${variant.image_link || ''}')">Update Product</button>
        <button class="btn sec" onclick="modal()">Cancel</button>
      </div>
    </div>
  `;
  modal(html);
}

async function saveEditedProduct(variantId, oldImageUrl) {
  const newVariant = v('e_variant').trim();
  const newPrice = +v('e_price');
  
  if(newPrice <= 0) return alert('Please enter a valid price');
  
  const btn = document.querySelector('.modal-content button.btn');
  const statusEl = document.getElementById('edit_upload_status');
  
  try {
    let finalImageUrl = oldImageUrl; 
    
    if (selectedFiles.length > 0) {
      statusEl.style.display = 'block';
      btn.disabled = true;
      btn.innerText = "Uploading...";
      
      const urls = await uploadImagesToSupabase();
      finalImageUrl = urls[coverIndex] || urls[0];
    }

    const { error } = await supabaseClient.from('variants').update({ 
      variant: newVariant, 
      price: newPrice, 
      image_link: finalImageUrl 
    }).eq('id', variantId);
    
    if(error) throw error;

    alert('Product updated successfully!');
    modal(); 
    loadDatabase(); 
    
  } catch (err) {
    alert('Error updating product: ' + err.message);
    btn.disabled = false;
    btn.innerText = "Update Product";
    statusEl.style.display = 'none';
  }
}

// Initial Load
loadDatabase();
</script>
</body>
</html>
