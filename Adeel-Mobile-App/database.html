<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Database - Adeel Mobile</title>
<!-- Supabase Library Add Ki Gayi Hai -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Top Buttons (Tabs) */
  .db-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .db-tabs::-webkit-scrollbar { display: none; }
  .db-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .db-tab-btn:hover { border-color: var(--pri); }
  .db-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  /* Panels */
  .db-panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .db-panel.active { display: block; }
  
  .db-panel h3 { font-size: 16px; color: var(--ink); margin-bottom: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }

  /* Brands List */
  .brand-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
  .brand-tag { background: var(--pri2); color: var(--pri); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .brand-tag span { cursor: pointer; color: var(--bad); font-size: 16px; line-height: 1; }

  /* Search Bar */
  .db-search { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); margin-bottom: 15px; font-size: 14px; outline: none; }
  .db-search:focus { border-color: var(--pri); }

  /* Product List for Price Update */
  .price-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
  .price-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; transition: 0.2s; }
  .price-item:hover { border-color: var(--pri); background: #fff; }
  .price-item-info b { display: block; font-size: 14px; color: var(--ink); }
  .price-item-info small { display: block; font-size: 12px; color: var(--mute); margin-top: 2px; }
  .price-item-amount { font-weight: 700; color: var(--pri); font-size: 15px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

let currentTab = 'brand'; // Default tab
let priceSearch = '';
let allBrands = [];
let allModels = [];
let allVariants = [];

// Naya function: Supabase se data fetch karne ke liye
async function fetchDatabaseData() {
  try {
    const { data: brands } = await supabaseClient.from('brands').select('*');
    const { data: models } = await supabaseClient.from('models').select('*');
    const { data: variants } = await supabaseClient.from('variants').select('*');
    allBrands = brands || [];
    allModels = models || [];
    allVariants = variants || [];
  } catch (err) {
    console.error(err);
    alert("Data fetch error: " + err.message);
  }
}

async function loadDatabase() {
  await fetchDatabaseData(); // Pehle data fetch karo

  let html = `
  <div class="top"><h2>Master Database</h2></div>
  
  <!-- Top Tabs (Buttons) -->
  <div class="db-tabs">
    <button class="db-tab-btn ${currentTab==='brand'?'active':''}" onclick="switchTab('brand')">🏷️ Add Brand</button>
    <button class="db-tab-btn ${currentTab==='model'?'active':''}" onclick="switchTab('model')">📱 Add Model</button>
    <button class="db-tab-btn ${currentTab==='bulk'?'active':''}" onclick="switchTab('bulk')">📦 Bulk Upload</button>
    <button class="db-tab-btn ${currentTab==='price'?'active':''}" onclick="switchTab('price')">💰 Price Update</button>
  </div>

  <!-- 1. Add Brand Panel -->
  <div class="db-panel ${currentTab==='brand'?'active':''}">
    <h3>Add New Brand</h3>
    <div style="display:flex; gap:10px;">
      <input id="new_brand" placeholder="e.g. Samsung, Apple">
      <button class="btn" onclick="addBrand()">Add</button>
    </div>
    <div class="brand-list">
      ${allBrands.map(b => `<div class="brand-tag">${esc(b.brand)} <span onclick="deleteBrand('${b.id}')">×</span></div>`).join('')}
    </div>
  </div>

  <!-- 2. Add Model Panel -->
  <div class="db-panel ${currentTab==='model'?'active':''}">
    <h3>Add New Model & Variant</h3>
    <label>Select Brand</label>
    <select id="m_brand">
      ${allBrands.map(b => `<option value="${b.id}">${esc(b.brand)}</option>`).join('') || '<option value="">No brands added yet</option>'}
    </select>
    <label>Model Name</label>
    <input id="m_name" placeholder="e.g. Galaxy A15">
    <label>Variant (RAM/Storage)</label>
    <input id="m_variant" placeholder="e.g. 8GB/128GB">
    <label>Price (Rs)</label>
    <input id="m_price" type="number" placeholder="0">
    <label>Image URL (Optional)</label>
    <input id="m_img" placeholder="https://...">
    <button class="btn" style="margin-top:15px; width:100%" onclick="addModel()">Save Model</button>
  </div>

  <!-- 3. Bulk Upload Panel -->
  <div class="db-panel ${currentTab==='bulk'?'active':''}">
    <h3>Bulk Upload (Coming Soon)</h3>
    <p class="hint">Filhal ye feature Supabase ke sath kaam nahi karta. Agli update mein aayega.</p>
  </div>

  <!-- 4. Price Update Panel -->
  <div class="db-panel ${currentTab==='price'?'active':''}">
    <h3>Price Updates</h3>
    <input type="text" class="db-search" id="searchPrice" placeholder="Search model name..." oninput="priceSearch=this.value; loadDatabase()" value="${esc(priceSearch)}">
    
    <div class="price-list">
      ${allVariants
        .filter(v => {
          const model = allModels.find(m => m.id === v.model_id);
          if(!model) return false;
          return model.model.toLowerCase().includes(priceSearch.toLowerCase());
        })
        .map(v => {
          const model = allModels.find(m => m.id === v.model_id);
          return `
          <div class="price-item" onclick="editPricePopup('${v.id}')">
            <div class="price-item-info">
              <b>${esc(model.model)}</b>
              <small>Variant: ${esc(v.variant || 'N/A')}</small>
            </div>
            <div class="price-item-amount">${rs(v.price)}</div>
          </div>`;
        }).join('') || '<p style="text-align:center; color:var(--mute);">No models found.</p>'}
    </div>
  </div>
  `;

  renderApp('Database', html);
}

function switchTab(tab) {
  currentTab = tab;
  loadDatabase();
}

// --- Actions ---

async function addBrand() {
  const b = v('new_brand').trim();
  if(!b) return alert('Please enter a brand name');
  if(allBrands.some(x => x.brand.toLowerCase() === b.toLowerCase())) return alert('This brand already exists');
  
  try {
    const { error } = await supabaseClient.from('brands').insert([{ brand: b }]);
    if(error) throw error;
    
    alert('Brand added to Supabase!');
    loadDatabase();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function deleteBrand(id) {
  if(confirm(`Delete this brand and all its models?`)) {
    try {
      const { error } = await supabaseClient.from('brands').delete().eq('id', id);
      if(error) throw error;
      loadDatabase();
    } catch(err) {
      alert('Error: ' + err.message);
    }
  }
}

async function addModel() {
  const brandId = v('m_brand');
  const name = v('m_name').trim();
  const variant = v('m_variant').trim();
  const price = +v('m_price');
  const img = v('m_img').trim();

  if(!brandId || !name || price <= 0) return alert('Please fill Brand, Model Name and Price');

  try {
    // 1. Model add karo (Agar pehle se nahi hai)
    let modelId = null;
    const existingModel = allModels.find(m => m.model.toLowerCase() === name.toLowerCase() && m.brand_id == brandId);
    
    if(existingModel) {
      modelId = existingModel.id;
    } else {
      const { data: newModel, error: mErr } = await supabaseClient.from('models').insert([{ brand_id: brandId, model: name }]).select();
      if(mErr) throw mErr;
      modelId = newModel[0].id;
    }

    // 2. Variant add karo
    const { error: vErr } = await supabaseClient.from('variants').insert([{
      model_id: modelId,
      variant: variant,
      price: price,
      image_link: img
    }]);
    if(vErr) throw vErr;

    alert('Model & Variant added to Supabase!');
    loadDatabase();

  } catch (err) {
    alert('Error: ' + err.message);
  }
}

// Price Update Popup
function editPricePopup(id) {
  const vItem = allVariants.find(x => x.id === id);
  if(!vItem) return;

  let html = `
    <h3>Update Price</h3>
    <label>New Price (Rs)</label>
    <input id="upd_price" type="number" value="${vItem.price}">
    <div style="margin-top:20px; display:flex; gap:10px;">
      <button class="btn" onclick="saveNewPrice('${id}')">Save Price</button>
      <button class="btn sec" onclick="modal()">Cancel</button>
    </div>
  `;
  modal(html);
}

async function saveNewPrice(id) {
  const newPrice = +v('upd_price');
  if(newPrice > 0) {
    try {
      const { error } = await supabaseClient.from('variants').update({ price: newPrice }).eq('id', id);
      if(error) throw error;
      
      modal();
      loadDatabase();
    } catch(err) {
      alert('Error updating price: ' + err.message);
    }
  } else {
    alert('Please enter a valid price.');
  }
}

loadDatabase();
</script>
</body>
</html>
