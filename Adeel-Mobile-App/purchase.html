<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purchase - Adeel Mobile</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Top Buttons (Tabs) */
  .pur-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .pur-tabs::-webkit-scrollbar { display: none; }
  .pur-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
  }
  .pur-tab-btn:hover { border-color: var(--pri); }
  .pur-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  /* Panels */
  .pur-panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .pur-panel.active { display: block; }
  
  .pur-panel h3 { font-size: 16px; color: var(--ink); margin-bottom: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }

  /* Table */
  .tw { margin-top: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

let currentTab = 'purchase'; // Default tab
let currentBrands = [...new Set(D.products.map(p => p.brand))];

function loadPurchase() {
  let html = `
  <div class="top"><h2>Purchase Management</h2></div>
  
  <!-- Top Buttons (Tabs) -->
  <div class="pur-tabs">
    <button class="pur-tab-btn ${currentTab==='purchase'?'active':''}" onclick="switchTab('purchase')">📥 New Purchase</button>
    <button class="pur-tab-btn ${currentTab==='brand'?'active':''}" onclick="switchTab('brand')">➕ Add Brand / Model</button>
    <button class="pur-tab-btn ${currentTab==='supplier'?'active':''}" onclick="switchTab('supplier')">🚚 Purchase Reports</button>
    <button class="pur-tab-btn ${currentTab==='stock'?'active':''}" onclick="switchTab('stock')">📦 Stock Report</button>
  </div>

  <!-- 1. New Purchase Panel -->
  <div class="pur-panel ${currentTab==='purchase'?'active':''}">
    <h3>New Purchase</h3>
    <label>Phone</label>
    <select id="p_phone">
      <option value="">-- Select Phone --</option>
      ${D.products.map(p => `<option value="${p.id}">${esc(p.brand)} ${esc(p.name)} (${esc(p.variant || '')}) – ${rs(p.price)} (Stock: ${p.stock})</option>`).join('')}
    </select>
    
    <label style="margin-top:15px;">Supplier Details</label>
    <div class="row">
      <div><input id="p_sname" placeholder="Supplier Name"></div>
      <div><input id="p_sphone" placeholder="Supplier Phone"></div>
    </div>

    <div class="row">
      <div><label>Purchase Price (Rs)</label><input id="p_price" type="number" value="0"></div>
      <div><label>Paid Amount (Rs)</label><input id="p_paid" type="number" value="0"></div>
    </div>

    <button class="btn" style="margin-top:15px; width:100%" onclick="savePurchase()">Save Purchase</button>
  </div>

  <!-- 2. Add Brand / Model Panel -->
  <div class="pur-panel ${currentTab==='brand'?'active':''}">
    <h3>Add Brand / Model</h3>
    
    <label>Add New Brand</label>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <input id="nb_name" placeholder="e.g. Samsung">
      <button class="btn" onclick="addBrand()">Add</button>
    </div>
    
    <label>Add New Model</label>
    <select id="nm_brand">
      ${currentBrands.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('') || '<option value="">No brands added</option>'}
    </select>
    
    <div class="row">
      <div><label>Model Name</label><input id="nm_name" placeholder="e.g. A15"></div>
      <div><label>Variant</label><input id="nm_variant" placeholder="e.g. 8GB/128GB"></div>
    </div>
    
    <button class="btn" style="margin-top:15px; width:100%" onclick="addModel()">Save Model</button>
  </div>

  <!-- 3. Purchase Reports with Suppliers Panel -->
  <div class="pur-panel ${currentTab==='supplier'?'active':''}">
    <h3>Purchase Reports (with Suppliers)</h3>
    <div class="tw"><table>
      <tr>
        <th>Date</th>
        <th>Phone Model</th>
        <th>Supplier</th>
        <th>Total Price</th>
        <th>Paid</th>
        <th>Remaining</th>
      </tr>
      ${(D.purchases || []).slice().reverse().map(p => `
        <tr>
          <td>${new Date(p.date).toLocaleDateString('en-GB')}</td>
          <td>${esc(p.pname)}</td>
          <td>${esc(p.sname)}<br><small style="color:var(--mute);">${esc(p.sphone)}</small></td>
          <td>${rs(p.total)}</td>
          <td>${rs(p.paid)}</td>
          <td style="color:var(--bad); font-weight:bold;">${rs(p.remaining)}</td>
        </tr>
      `).join('') || '<tr><td colspan="6" style="text-align:center; color:var(--mute);">No purchases found.</td></tr>'}
    </table></div>
  </div>

  <!-- 4. Stock Report Panel -->
  <div class="pur-panel ${currentTab==='stock'?'active':''}">
    <h3>Stock Report (All Models)</h3>
    <div class="tw"><table>
      <tr>
        <th>Brand</th>
        <th>Model</th>
        <th>Variant</th>
        <th>Purchase Price</th>
        <th>Stock Qty</th>
      </tr>
      ${D.products.map(p => `
        <tr>
          <td>${esc(p.brand)}</td>
          <td>${esc(p.name)}</td>
          <td>${esc(p.variant || '-')}</td>
          <td>${rs(p.price)}</td>
          <td style="color:${p.stock > 0 ? 'var(--ok)' : 'var(--bad)'}; font-weight:bold;">${p.stock}</td>
        </tr>
      `).join('') || '<tr><td colspan="5" style="text-align:center; color:var(--mute);">No products found.</td></tr>'}
    </table></div>
  </div>
  `;

  renderApp('Purchase', html);
}

function switchTab(tab) {
  currentTab = tab;
  loadPurchase();
}

function savePurchase() {
  const pid = v('p_phone');
  const p = D.products.find(x => x.id === pid);
  if(!p) return alert('Please select a phone');

  const sname = v('p_sname').trim();
  const sphone = v('p_sphone').trim();
  const paid = +v('p_paid') || 0;
  
  if(!sname) return alert('Please enter supplier name');

  D.purchases.push({
    id: uid(), userId: me.id, productId: p.id, pname: p.brand + ' ' + p.name,
    sname: sname, sphone: sphone, price: p.price, paid: paid, total: p.price, remaining: p.price - paid, date: Date.now()
  });

  p.stock++; // Stock barhaya

  if(paid > 0) {
    D.cashbook.push({
      id: uid(), date: Date.now(), type: 'Out', amount: paid,
      description: `Purchase Paid - ${sname} (${p.brand} ${p.name})`, refId: p.id
    });
  }

  save();
  alert('Purchase saved & Stock updated!');
  loadPurchase();
}

function addBrand() {
  const b = v('nb_name').trim();
  if(!b) return alert('Please enter a brand name');
  if(currentBrands.includes(b)) return alert('This brand already exists');
  
  currentBrands.push(b);
  // Save karna ho to yahan save logic likh sakte hain (filhal frontend par hai)
  v('nb_name') = '';
  loadPurchase();
}

function addModel() {
  const brand = v('nm_brand');
  const name = v('nm_name').trim();
  const variant = v('nm_variant').trim();

  if(!brand || !name) return alert('Please fill brand and model name');

  // Naya product add karna (price aur stock 0 ke sath)
  D.products.push({
    id: uid(),
    brand: brand,
    name: name,
    variant: variant,
    price: 0,
    stock: 0
  });
  
  save();
  alert('Model added! You can set price in Database or Purchase it now.');
  loadPurchase();
}

loadPurchase();
</script>
</body>
</html>
