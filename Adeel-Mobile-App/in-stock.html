<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In Stock - Adeel Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .stock-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .stock-tabs::-webkit-scrollbar { display: none; }
  .stock-tab-btn { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
  .stock-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }
  
  .stock-search { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); margin-bottom: 15px; font-size: 14px; outline: none; }

  .table-container { width: 100%; overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .data-table { width: 100%; border-collapse: collapse; min-width: 500px; }
  .data-table th { background: #f8fafc; color: var(--mute); font-size: 12px; font-weight: 700; text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); }
  .data-table td { padding: 10px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink); }
  .data-table tr:last-child td { border-bottom: none; }
  
  .stock-badge { padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; background: #d1fae5; color: #065f46; }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

let allBrands = [];
let allModels = [];
let allVariants = [];
let allPurchases = [];
let allSales = [];
let currentBrand = 'All';
let searchQuery = '';

async function fetchData() {
  try {
    const { data: brands } = await supabaseClient.from('brands').select('id, brand');
    const { data: models } = await supabaseClient.from('models').select('id, brand_id, model');
    const { data: variants } = await supabaseClient.from('variants').select('*');
    const { data: purchases } = await supabaseClient.from('purchases').select('*');
    const { data: sales } = await supabaseClient.from('orders').select('*'); 
    
    allBrands = brands || [];
    allModels = models || [];
    allVariants = variants || [];
    allPurchases = purchases || [];
    allSales = sales || [];
  } catch (err) {
    console.error(err);
    alert("Data fetch error: " + err.message);
  }
}

function getStockForVariant(variantId) {
  const purchased = allPurchases.filter(p => p.variant_id === variantId).reduce((sum, p) => sum + p.quantity, 0);
  const sold = allSales.filter(s => s.variant_id === variantId).reduce((sum, s) => sum + (s.quantity || 1), 0);
  return purchased - sold;
}

// Average Purchase Price nikalne ka function
function getAvgPurchasePrice(variantId) {
  const purchases = allPurchases.filter(p => p.variant_id === variantId);
  if (purchases.length === 0) return 0;
  
  let totalCost = 0;
  let totalQty = 0;
  purchases.forEach(p => {
    totalCost += (p.cost_price * p.quantity);
    totalQty += p.quantity;
  });
  
  return totalQty > 0 ? Math.round(totalCost / totalQty) : 0;
}

async function loadStockPage(){
  await fetchData();

  let filtered = allVariants;
  
  if (currentBrand !== 'All') {
    const brandObj = allBrands.find(b => b.brand === currentBrand);
    if (brandObj) {
      const modelIds = allModels.filter(m => m.brand_id === brandObj.id).map(m => m.id);
      filtered = filtered.filter(v => modelIds.includes(v.model_id));
    }
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(v => {
      const model = allModels.find(m => m.id === v.model_id);
      return model && model.model.toLowerCase().includes(q);
    });
  }

  // Filter out variants with 0 stock
  const inStockVariants = filtered.filter(v => getStockForVariant(v.id) > 0);

  let html = `
  <div class="top"><h2>Stock Report</h2></div>
  
  <div class="stock-tabs">
    <button class="stock-tab-btn ${currentBrand==='All'?'active':''}" onclick="filterBrand('All')">All Brands</button>
    ${allBrands.map(b => `<button class="stock-tab-btn ${currentBrand===b.brand?'active':''}" onclick="filterBrand('${esc(b.brand)}')">${esc(b.brand)}</button>`).join('')}
  </div>

  <input type="text" class="stock-search" placeholder="Search model..." oninput="searchQuery=this.value; loadStockPage()" value="${esc(searchQuery)}">

  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Model</th>
          <th>Variant</th>
          <th>Qty</th>
          <th>Purchase Price</th>
        </tr>
      </thead>
      <tbody>
        ${inStockVariants.map(v => {
          const model = allModels.find(m => m.id === v.model_id);
          const brand = allBrands.find(b => b.id === model?.brand_id);
          const stock = getStockForVariant(v.id);
          const avgCost = getAvgPurchasePrice(v.id);

          return `<tr>
            <td><b>${esc(model ? model.model : 'Unknown')}</b><br><small>${esc(brand ? brand.brand : '')}</small></td>
            <td>${esc(v.variant || 'N/A')}</td>
            <td><span class="stock-badge">${stock} Units</span></td>
            <td>${rs(avgCost)}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="4" style="text-align:center; color:var(--mute); padding:20px;">No stock available. Please make a purchase first.</td></tr>'}
      </tbody>
    </table>
  </div>
  `;

  renderApp('Stock', html);
}

function filterBrand(brandName) {
  currentBrand = brandName;
  loadStockPage();
}

loadStockPage();
</script>
</body>
</html>
