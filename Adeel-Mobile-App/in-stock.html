<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock - Adeel Mobile</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Top Buttons (Tabs) */
  .stock-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .stock-tabs::-webkit-scrollbar { display: none; }
  .stock-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
  }
  .stock-tab-btn:hover { border-color: var(--pri); }
  .stock-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';

// Brands list jinke buttons humein dikhane hain
const STOCK_BRANDS = ['All', 'Samsung', 'Infinix', 'Tecno', 'Itel', 'Other'];
let currentBrandTab = 'All'; // Default brand

function loadStock() {
  // 1. Filter products based on selected brand
  let filteredProducts = D.products;
  if(currentBrandTab !== 'All') {
    if(currentBrandTab === 'Other') {
      // Wo brands jo list mein nahi hain
      filteredProducts = D.products.filter(p => !STOCK_BRANDS.includes(p.brand));
    } else {
      filteredProducts = D.products.filter(p => p.brand === currentBrandTab);
    }
  }

  // 2. Calculate Stats for filtered products
  let totalValue = 0;
  let totalPhones = 0;
  filteredProducts.forEach(p => {
    totalValue += (p.price * p.stock);
    totalPhones += p.stock;
  });

  let html = `
  <div class="top">
    <h2>Stock (Inventory)</h2>
    <a href="new-sale.html" class="btn">+ Sale / Purchase</a>
  </div>
  
  <!-- Brand Buttons -->
  <div class="stock-tabs">
    ${STOCK_BRANDS.map(b => `
      <button class="stock-tab-btn ${currentBrandTab === b ? 'active' : ''}" onclick="switchBrand('${b}')">
        ${b}
      </button>
    `).join('')}
  </div>

  <!-- Summary Cards -->
  <div class="grid">
    <div class="stat"><small>Total Phones in ${currentBrandTab}</small><b>${totalPhones}</b></div>
    <div class="stat"><small>Total Value in ${currentBrandTab}</small><b style="color:var(--ok)">${rs(totalValue)}</b></div>
  </div>

  <!-- Stock Table -->
  <div class="tw"><table>
    <tr>
      <th>Brand</th>
      <th>Model</th>
      <th>Variant</th>
      <th>Purchase Price</th>
      <th>Available Stock</th>
      <th>Total Value</th>
    </tr>
    ${filteredProducts.map(p=>`<tr>
      <td>${esc(p.brand)}</td>
      <td>${esc(p.name)}</td>
      <td>${esc(p.variant || '-')}</td>
      <td>${rs(p.price)}</td>
      <td>
        <b style="color:${p.stock>0?'var(--ok)':'var(--bad)'}; font-size:16px;">${p.stock}</b>
      </td>
      <td>${rs(p.price * p.stock)}</td>
    </tr>`).join('') || '<tr><td colspan="6" style="color:var(--mute); text-align:center;">Stock is empty for this brand. Please Purchase.</td></tr>'}
  </table></div>`;

  renderApp('Stock', html);
}

// Function to switch brand
function switchBrand(brand) {
  currentBrandTab = brand;
  loadStock();
}

loadStock();
</script>
</body>
</html>
