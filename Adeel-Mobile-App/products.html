<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Products - Adeel Mobile</title>
<!-- Supabase Library Add Ki Gayi Hai -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

let allBrands = [];
let allModels = [];
let allVariants = [];

async function loadProductsFromSupabase() {
  const tableBody = document.getElementById('productTableBody');
  if (!tableBody) return;

  tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading products...</td></tr>';

  try {
    // 1. Brands
    const { data: brands, error: bErr } = await supabaseClient.from('brands').select('*');
    if (bErr) throw new Error("Brands: " + bErr.message);

    // 2. Models
    const { data: models, error: mErr } = await supabaseClient.from('models').select('*');
    if (mErr) throw new Error("Models: " + mErr.message);

    // 3. Variants
    const { data: variants, error: vErr } = await supabaseClient.from('variants').select('*');
    if (vErr) throw new Error("Variants: " + vErr.message);

    allBrands = brands || [];
    allModels = models || [];
    allVariants = variants || [];

    if (allVariants.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No products found in Database.</td></tr>';
      return;
    }

    let html = '';
    allVariants.forEach(v => {
      const model = allModels.find(m => m.id === v.model_id);
      if(!model) return;
      const brand = allBrands.find(b => b.id === model.brand_id);
      
      const brandName = brand ? brand.brand : 'Unknown';
      const modelName = model.model;
      const variantName = v.variant || 'Standard';
      const price = v.price || 0;
      
      html += `<tr>
        <td>${esc(brandName)}</td>
        <td>${esc(modelName)}</td>
        <td>${esc(variantName)}</td>
        <td>${rs(price)}</td>
        <td>
          <button class="btn sm sec" onclick="editProduct('${v.id}')">Edit</button>
          <button class="btn sm red" onclick="deleteProduct('${v.id}')">Del</button>
        </td>
      </tr>`;
    });

    tableBody.innerHTML = html;

  } catch (err) {
    console.error(err);
    tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--bad);">Error: ${err.message}</td></tr>`;
  }
}

function loadProducts() {
  let html = `
  <div class="top">
    <h2>Products (Database)</h2>
    <button class="btn" onclick="prodM()">+ Add Product</button>
  </div>
  <div class="tw">
    <table>
      <thead>
        <tr><th>Brand</th><th>Model</th><th>Variant</th><th>Price</th><th>Actions</th></tr>
      </thead>
      <tbody id="productTableBody">
        <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
      </tbody>
    </table>
  </div>`;

  renderApp('Products', html);
  loadProductsFromSupabase();
}

function prodM(id) {
  if(id) return alert("Edit feature coming soon!");
  const brandOptions = allBrands.map(b => `<option value="${b.id}">${esc(b.brand)}</option>`).join('');
  let html = `
    <h3>Add New Product</h3>
    <label>Select Brand</label>
    <select id="p_brand">${brandOptions}</select>
    <label>Model Name</label>
    <input id="p_model" placeholder="e.g. Galaxy A15">
    <label>Variant (RAM/Storage)</label>
    <input id="p_variant" placeholder="e.g. 8GB/128GB">
    <label>Price (Rs)</label>
    <input id="p_price" type="number" placeholder="0">
    <label>Stock Quantity</label>
    <input id="p_stock" type="number" placeholder="0">
    <label>Image URL (Optional)</label>
    <input id="p_img" placeholder="https://...">
    <div style="margin-top:15px; display:flex; gap:10px;">
      <button class="btn" onclick="saveNewProduct()">Save Product</button>
      <button class="btn sec" onclick="modal()">Cancel</button>
    </div>
  `;
  modal(html);
}

async function saveNewProduct() {
  const brandId = document.getElementById('p_brand').value;
  const modelName = document.getElementById('p_model').value.trim();
  const variant = document.getElementById('p_variant').value.trim();
  const price = +document.getElementById('p_price').value;
  const stock = +document.getElementById('p_stock').value;
  const img = document.getElementById('p_img').value.trim();

  if(!brandId || !modelName || !price) return alert('Brand, Model and Price are required');

  try {
    let modelId = null;
    const existingModel = allModels.find(m => m.model === modelName && m.brand_id == brandId);
    if(existingModel) {
      modelId = existingModel.id;
    } else {
      const { data: newModel, error: mErr } = await supabaseClient.from('models').insert([{ brand_id: brandId, model: modelName }]).select();
      if(mErr) throw mErr;
      modelId = newModel[0].id;
    }

    const { error: vErr } = await supabaseClient.from('variants').insert([{
      model_id: modelId, variant: variant, price: price, stock: stock, image_link: img
    }]);
    if(vErr) throw vErr;

    alert('Product added successfully!');
    modal();
    loadProducts();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function deleteProduct(id) {
  if(confirm('Delete this product?')) {
    const { error } = await supabaseClient.from('variants').delete().eq('id', id);
    if(error) return alert('Delete Error: ' + error.message);
    loadProducts();
  }
}

function editProduct(id) { alert("Coming soon!"); }

loadProducts();
</script>
</body>
</html>
