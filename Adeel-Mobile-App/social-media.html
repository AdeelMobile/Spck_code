<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Media - Adeel Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .sm-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
  .sm-tabs::-webkit-scrollbar { display: none; }
  .sm-tab-btn {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
  }
  .sm-tab-btn:hover { border-color: var(--pri); }
  .sm-tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  .sm-panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .sm-panel.active { display: block; }
  .sm-panel h3 { font-size: 16px; color: var(--ink); margin-bottom: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script>
if(!me) window.location.href='index.html';
if(me.role!=='admin') window.location.href='dashboard.html';

let currentTab = 'pricelist';

function loadPage() {
  let html = `
  <div class="top"><h2>Social Media</h2></div>
  
  <div class="sm-tabs">
    <button class="sm-tab-btn ${currentTab==='pricelist'?'active':''}" onclick="switchTab('pricelist')">📋 Price List</button>
    <button class="sm-tab-btn ${currentTab==='comparisons'?'active':''}" onclick="switchTab('comparisons')">📊 Comparisons</button>
    <button class="sm-tab-btn ${currentTab==='catalog'?'active':''}" onclick="switchTab('catalog')">📖 Catalog</button>
    <button class="sm-tab-btn ${currentTab==='poster'?'active':''}" onclick="switchTab('poster')">🖼️ Poster</button>
  </div>

  <div class="sm-panel ${currentTab==='pricelist'?'active':''}">
    <h3>Price List</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>

  <div class="sm-panel ${currentTab==='comparisons'?'active':''}">
    <h3>Comparisons</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>

  <div class="sm-panel ${currentTab==='catalog'?'active':''}">
    <h3>Catalog</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>

  <div class="sm-panel ${currentTab==='poster'?'active':''}">
    <h3>Poster</h3>
    <p style="color:var(--mute); text-align:center; padding:20px;">Coming soon...</p>
  </div>
  `;

  renderApp('Social Media', html);
}

function switchTab(tab) {
  currentTab = tab;
  loadPage();
}

loadPage();
</script>
</body>
</html>
