<!DOCTYPE html>
<html lang="en">
<head>

<title>My Verifications - Adeel Mobile</title>

<body>
<div id="root"></div>
<script src="js/app.js"></script>

<script>
if(!me) window.location.href='index.html';

function loadMyVerifications(){
  let html = `<div class="top"><h2>My Verifications</h2></div>`;
  
  html += `<div class="card" style="text-align:center; padding:40px;">
    <div style="font-size:40px; margin-bottom:10px;">📭</div>
    <p style="color:var(--mute);">Aapki koi verification abhi pending nahi hai.</p>
  </div>`;

  renderApp('My Verifications', html);
}

loadMyVerifications();
</script>
